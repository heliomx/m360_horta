<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%">
  <style>
    .title { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #1a237e; }
    .subtitle { font-family: sans-serif; font-size: 11px; fill: #5c6bc0; }
    .box-mcu { fill: #e3f0ff; stroke: #0055aa; stroke-width: 2; }
    .box-radio { fill: #e8f5e9; stroke: #1a7a3a; stroke-width: 2; }
    .box-power { fill: #fff8e1; stroke: #f9a825; stroke-width: 2; }
    .box-sensors { fill: #e0f2f1; stroke: #00796b; stroke-width: 2; }
    .text-bold { font-family: sans-serif; font-size: 12px; font-weight: bold; fill: #333; }
    .text-normal { font-family: sans-serif; font-size: 10px; fill: #444; }
    .text-pin { font-family: sans-serif; font-size: 11px; font-weight: bold; fill: #b71c1c; }
    .text-vcc { font-family: sans-serif; font-size: 10px; font-weight: bold; fill: #e65100; }
  </style>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#333" />
    </marker>
  </defs>

  <!-- Cabeçalho -->
  <text x="20" y="30" class="title">Nó 02 (Solo3dNano) — Monitoramento de Solo (6 Canais Diretos)</text>
  <text x="20" y="48" class="subtitle">Diagrama de Blocos de Hardware e Mapeamento de Sinais</text>

  <!-- FONTE DE ALIMENTAÇÃO -->
  <rect x="20" y="80" width="160" height="70" rx="6" class="box-power"/>
  <text x="100" y="100" class="text-bold" text-anchor="middle">🔋 FONTE 5V DC</text>
  <text x="100" y="120" class="text-normal" text-anchor="middle">Alimentação Fixa</text>

  <!-- MICROCONTROLADOR (ARDUINO NANO) -->
  <rect x="240" y="80" width="280" height="210" rx="6" class="box-mcu"/>
  <text x="380" y="105" class="text-bold" text-anchor="middle">🧠 ARDUINO NANO</text>
  <text x="380" y="122" class="text-normal" text-anchor="middle">ATmega328P (5V / 16MHz)</text>
  <text x="380" y="137" class="text-normal" text-anchor="middle">Modo: ALWAYS_ON (Timer)</text>

  <!-- Transceptor Rádio nRF24L01+ -->
  <rect x="240" y="340" width="280" height="80" rx="6" class="box-radio"/>
  <text x="380" y="365" class="text-bold" text-anchor="middle">📡 TRANSCEPTOR RF</text>
  <text x="380" y="385" class="text-normal" text-anchor="middle">Módulo nRF24L01+ (2.4 GHz)</text>
  <text x="380" y="400" class="text-normal" text-anchor="middle">CE=D9, CSN=D10, SPI=D11-D13</text>

  <!-- SENSORES DE UMIDADE DE SOLO -->
  <rect x="20" y="240" width="160" height="150" rx="6" class="box-sensors"/>
  <text x="100" y="265" class="text-bold" text-anchor="middle">🌱 SENSORES SOLO</text>
  <text x="100" y="285" class="text-normal" text-anchor="middle">6 Sensores Resistivos</text>
  <text x="100" y="300" class="text-normal" text-anchor="middle">Conectados Diretamente</text>
  <text x="100" y="315" class="text-normal" text-anchor="middle">(Canteiro B)</text>

  <!-- LINHAS DE SINAL -->

  <!-- Alimentação 5V DC -> Arduino -->
  <path d="M 180,115 L 240,115" fill="none" stroke="#f9a825" stroke-width="2" marker-end="url(#arr)"/>
  <text x="210" y="110" class="text-vcc" text-anchor="middle">5V DC</text>

  <!-- Barramento SPI (Arduino -> Rádio) -->
  <path d="M 380,290 L 380,340" fill="none" stroke="#1a7a3a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="390" y="315" class="text-normal" font-weight="bold">SPI Bus / CE, CSN</text>

  <!-- Controle de Pull-ups / Chaveamento VCC (Arduino D3 -> Barra de Resistores) -->
  <path d="M 240,170 L 140,170 L 140,240" fill="none" stroke="#e65100" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr)"/>
  <text x="190" y="160" class="text-pin" text-anchor="middle">D3 (VCC Chaveado)</text>

  <!-- Pinos de Leitura Analógica (Sensores -> Arduino A0-A5) -->
  <path d="M 180,360 L 210,360 L 210,220 L 240,220" fill="none" stroke="#0055aa" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="220" y="210" class="text-pin">A0-A5 (Sinal)</text>

</svg>
