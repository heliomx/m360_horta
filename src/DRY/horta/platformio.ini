; PlatformIO Project Configuration File - Root (Monorepo)
; =======================================================
; M360 Horta IoT agricultural monitoring system.
; Main configuration for Gateway and Sensor/Actuator Nodes.
; Docs: https://docs.platformio.org/



; ===== FLAGS COMUNS =====
[common]
flags =
    -Iinclude
    -D MY_BAUD_RATE=115200
    -D MY_RADIO_RF24
    -D MY_RF24_DATARATE=RF24_250KBPS
    -D MY_RF24_PA_LEVEL=RF24_PA_HIGH
    -D MY_REBOOT_FEATURE
    ; MY_RADIO_TIMEOUT_MS NÃO vai aqui — impacta nós LOW_POWER. Defina por env.
monitor_speed = 115200

; ===== VERIFICAÇÃO ESTÁTICA — biblioteca M360-DRY =====
; Executar: pio check -e check_m360_dry
; A build falha se cppcheck reportar erros (error/warning level).
[env:check_m360_dry]
platform = atmelavr
board = pro8MHzatmega328
framework = arduino
lib_deps =
    mysensors/MySensors@^2.3.2
; Caminho relativo ao src_dir do projeto raiz (= raiz do repo, ver platformio.ini raiz)
build_src_filter = +<lib/M360-DRY/src/*>
check_tool = cppcheck
check_severity = medium, high
; check_src_filters limita o escopo do cppcheck APENAS à lib M360-DRY.
; Sem isto, como src_dir = raiz do repo, o check varre .pio/libdeps e os
; exemplos do MySensors, e reporta defeitos de terceiros como se fossem nossos.
; (check_skip_packages sozinho não cobre libs resolvidas via lib_deps.)
check_src_filters =
    +<lib/M360-DRY/src/>
check_flags =
    cppcheck: --enable=warning,style,performance,portability
              --suppress-xml=lib/M360-DRY/cppcheck-suppressions.cfg
              --inline-suppr
              --std=c++11
check_skip_packages = yes

; =======================================================
; ENV: GATEWAY COM LIB DRY (ESP8266 D1 Mini)
; =======================================================
[env:d1_mini_gateway]
; Idêntico a d1_mini, mas usa libDryGatewayMqtt.cpp (com M360::M360Gateway)
; em vez de newGatewayMqtt.cpp. Útil para validar a integração da LibDRY.
platform = espressif8266@2.6.3
board = d1_mini
framework = arduino
build_src_filter =
    +<src/DRY/horta/gateway/*.cpp>

monitor_port = COM5
upload_port = COM5
upload_speed = 115200
monitor_speed = ${common.monitor_speed}

board_build.filesystem = littlefs
upload_resetmethod = nodemcu
upload_flags =
    --before=default_reset
    --after=hard_reset

lib_deps =
    mysensors/MySensors@^2.3.2
    bblanchon/ArduinoJson@^6.21.3
    knolleary/PubSubClient@^2.8

build_flags =
    ${common.flags}
    -D MQTT_MAX_PACKET_SIZE=512
    -D MY_NODE_ID=0
    -D MY_TRANSPORT_WAIT_READY_MS=1
    -D MY_GATEWAY_FEATURE
    -D MY_RF24_CE_PIN=2
    -D MY_RF24_CSN_PIN=15
    -D MY_TRANSPORT_DISCOVERY_TIMEOUT=60000
    -D MY_TRANSPORT_SANITY_CHECK_INTERVAL_MS=30000
    -D MY_OTA_LOG_SENDER_FEATURE
    ; Modo de publicação MQTT: ATIVO = formato nativo MySensors
    ;   out: {prefix}/out/{nodeId}/{sensorId}/{command}/{ack}/{type} + payload bruto
    ;   in : assina {prefix}/in/#  (ver MQTTManager::buildTopicIn)
    ; Comentar esta linha volta ao envelope JSON M360 — exige ajustar o
    ; "Decodificador Nativo MySensors" do Node-RED, que aceita os dois formatos.
    -D M360_NATIVE_MQTT=1
; =======================================================
; ENV: NÓ CENTRAL DE ATUAÇÃO ESTUFA (Arduino Nano ATmega328)
; Nó 99 — nodeReles
; Hardware: Arduino Nano + MUX CD74HC4067 + 16 Relés 10A
; Pinagem (fonte: sensorDrivers.h):
;   MUX      D8=SIG, D4-D7=S0-S3  -> Sol.A/B/C, Perist.SuplA/B, pH+/pH-
;   Nativos  A0=BombaNFT, A1=BombaOxi
;   DHT11    D2
;   Vazão    D3 (INT1, YF-S201)
; Child IDs (contrato com o Node-RED): 11/12 clima, 21 vazão, 31-39 atuadores
; =======================================================
[env:nano_99reles]
extends = common
platform = atmelavr
board = nanoatmega328
framework = arduino
lib_deps =
	mysensors/MySensors@^2.3.2
	adafruit/DHT sensor library@^1.4.6
	adafruit/Adafruit Unified Sensor@^1.1.14
build_flags =
	${common.flags}
	-D MY_NODE_ID=99
	-D MY_DEBUG
build_src_filter = +<src/DRY/horta/nos/99nodeReles/>

; === Nó 99 como Repeater ===
; Mesmo hardware que nano_99reles. MY_REPEATER_FEATURE ativa o encaminhamento de
; mensagens de nós fora do alcance direto do gateway (tabela de roteamento 256B em EEPROM).
; Manter FORA de default_envs — flash manual: pio run -e nano_99reles_rep -t upload
[env:nano_99reles_rep]
extends = env:nano_99reles
build_flags =
	${env:nano_99reles.build_flags}
	-D MY_REPEATER_FEATURE

