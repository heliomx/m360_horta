; PlatformIO — sub-projeto Horta (incluído pelo platformio.ini da raiz via extra_configs)
; =======================================================
; Envs do gateway e dos nós da Horta, perfis de rádio e a seção [common], que
; também é herdada pelos envs do Kit Hélio.
; Docs: https://docs.platformio.org/



; ===== PERFIS DE RÁDIO =====
; --- Rádio Legado: nRF24L01+ (2.4 GHz) ---
[radio_rf24]
flags =
    -D MY_RADIO_RF24
    ; Canal: usar o padrao do MySensors (76) — validado em 20/08/2026 com 38/38
    ; entregas. Nao definir MY_RF24_CHANNEL sem medicao que justifique: o canal
    ; 86 foi testado durante a caca a uma falha que era do radio do gateway,
    ; nao interferencia. Ver "Armadilhas Criticas" no CLAUDE.md.
    -D MY_RF24_DATARATE=RF24_250KBPS
    -D MY_RF24_PA_LEVEL=RF24_PA_HIGH

; --- Rádio LoRa: HopeRF RFM95W / SX1276 (915 MHz Brasil) ---
; Frequência 916.8 MHz (faixa ANATEL 915–928 MHz).
; ATENÇÃO: A macro de modem do MySensors usa a grafia histórica com typo 'CONFIGRUATION'.
[radio_rfm95]
flags =
    -D MY_RADIO_RFM95
    -D MY_RFM95_FREQUENCY=916800000UL
    -D MY_RFM95_MODEM_CONFIGRUATION=RFM95_BW125CR45SF128
    -D MY_RFM95_MAX_POWER_LEVEL_DBM=17
    -D MY_RFM95_ATC_TARGET_RSSI=-100

; ===== FLAGS COMUNS =====
[common]
; --- RÁDIO DA REDE DA ESTUFA ---
; O rádio é escolhido por REDE (um gateway e seus nós), nunca por nó: um rádio por
; rede (AD-15 do spine). A rede da estufa (gateway e Nós 1, 2, 4 e 99) é nRF24L01+,
; decisão de 2026-10-17, também nas placas M360 (lp_01, lp_02, act_99*, d1_mini_gw),
; que usam o header nRF24 legado. Os protótipos e o Kit Hélio são fixos em nRF24
; por [proto_rf24] / [kit_helio].
; Uma propriedade NOVA em LoRa não mexe aqui: seus envs (nós e gateway) usam
; ${lora_net.flags} no lugar de ${common.flags} (workflow m360-node-factory, 1.4).
radio_flags = ${radio_rf24.flags}

; Flags comuns sem rádio — usadas por quem fixa o rádio por conta própria (Kit Hélio).
base_flags =
    -Iinclude
    -D MY_BAUD_RATE=115200
    -D MY_REBOOT_FEATURE

flags =
    ${common.base_flags}
    ${common.radio_flags}
monitor_speed = 115200

; ===== PROTÓTIPOS EM CAMPO (hardware nRF24L01+) =====
; Nano, Pro Mini 16 MHz e o protótipo do gateway só têm nRF24: rádio fixo, fora do
; radio_flags. Os envs de protótipo usam ${proto_rf24.flags}, nunca ${common.flags}.
[proto_rf24]
flags =
    ${common.base_flags}
    ${radio_rf24.flags}

; ===== REDE LoRa (propriedades novas) =====
; Envs de nós e do gateway de uma rede LoRa: ${lora_net.flags} no lugar de
; ${common.flags}. Todos os nós e o gateway da rede trocam juntos.
[lora_net]
flags =
    ${common.base_flags}
    ${radio_rfm95.flags}

; ===== VERIFICAÇÃO ESTÁTICA — biblioteca M360-DRY =====
; Executar: pio check -e check_m360_dry
; A build falha se cppcheck reportar erros (error/warning level).
[env:check_m360_dry]
platform = atmelavr
board = pro8MHzatmega328
framework = arduino
lib_deps =
    mysensors/MySensors@^2.3.2
; Caminho relativo ao src_dir do projeto raiz (= raiz do repo, ver platformio.ini raiz)
build_src_filter = +<lib/M360-DRY/src/*>
check_tool = cppcheck
check_severity = medium, high
; check_src_filters limita o escopo do cppcheck APENAS à lib M360-DRY.
; Sem isto, como src_dir = raiz do repo, o check varre .pio/libdeps e os
; exemplos do MySensors, e reporta defeitos de terceiros como se fossem nossos.
; (check_skip_packages sozinho não cobre libs resolvidas via lib_deps.)
check_src_filters =
    +<lib/M360-DRY/src/>
check_flags =
    cppcheck: --enable=warning,style,performance,portability
              --suppress-xml=lib/M360-DRY/cppcheck-suppressions.cfg
              --inline-suppr
              --std=c++11
check_skip_packages = yes

; =======================================================
; ENV: GATEWAY COM LIB DRY (ESP8266 D1 Mini)
; =======================================================
[env:d1_mini_gateway]
extends = common
; Gateway da Horta no protótipo em bancada (D1 mini + nRF24 avulso, LED verde em D1).
; Na placa M360-GW use d1_mini_gw: lá o D1 é o DIO0 do RFM95W.
platform = espressif8266@2.6.3
board = d1_mini
framework = arduino
build_src_filter =
    +<src/DRY/horta/gateway/*.cpp>

monitor_port = COM5
upload_port = COM5
upload_speed = 115200
monitor_speed = ${common.monitor_speed}

board_build.filesystem = littlefs
upload_resetmethod = nodemcu
upload_flags =
    --before=default_reset
    --after=hard_reset

lib_deps =
    mysensors/MySensors@^2.3.2
    bblanchon/ArduinoJson@^6.21.3
    knolleary/PubSubClient@^2.8

build_flags =
    ${proto_rf24.flags}
    -D MQTT_MAX_PACKET_SIZE=512
    -D MY_NODE_ID=0
    -D MY_TRANSPORT_WAIT_READY_MS=1
    -D MY_GATEWAY_FEATURE
    -D MY_RF24_CE_PIN=2
    -D MY_RF24_CSN_PIN=15
    -D MY_TRANSPORT_DISCOVERY_TIMEOUT=60000
    -D MY_TRANSPORT_SANITY_CHECK_INTERVAL_MS=30000
    -D MY_OTA_LOG_SENDER_FEATURE
    ; Modo de publicação MQTT: ATIVO = formato nativo MySensors
    ;   out: {prefix}/out/{nodeId}/{sensorId}/{command}/{ack}/{type} + payload bruto
    ;   in : assina {prefix}/in/#  (ver MQTTManager::buildTopicIn)
    ; Comentar esta linha volta ao envelope JSON M360 — exige ajustar o
    ; "Decodificador Nativo MySensors" do Node-RED, que aceita os dois formatos.
    -D M360_NATIVE_MQTT=1

; =======================================================
; PLACA M360-GW (ESP8266 D1 Mini no carrier novo) — gateway Horta
; Mesmo fonte de d1_mini_gateway; a diferença de placa fica atrás de
; -D M360_BOARD_GW (decisão 8 do ARQUITETURA_FAMILIA.md: o env d1_mini_gateway
; segue servindo o protótipo). Pinagem (ARQUITETURA_FAMILIA.md §6):
;   LED verde  D4 (GPIO2) via 2N7002 Q1, ativo em HIGH — no protótipo é o D1
;   Rádio      D1 = DIO0 do RFM95W (padrão da lib no ESP8266), D8 = NSS;
;              DIO1 e RESET não ligados — não definir MY_RFM95_RST_PIN
;   nRF24 legado no header J4 (exclusivo com o mezanino): CE=D1 (GPIO5), CSN=D8
;   Reed (AP)  A0, mesmo pino do botão do protótipo
; =======================================================
; O extends herda portas, lib_deps e build_src_filter. Os build_flags são a cópia
; integral dos do pai, não ${env:d1_mini_gateway.build_flags}: herdar e acrescentar
; -D MY_RF24_CE_PIN=5 deixaria os dois -D na linha de comando (metadata de
; 2026-10-14 mostrou CE_PIN=2 e =5 juntos) e o compilador acusaria redefinição.
; Qualquer flag nova no d1_mini_gateway tem de ser replicada aqui.
[env:d1_mini_gw]
extends = env:d1_mini_gateway
build_flags =
    ${common.flags}
    -D MQTT_MAX_PACKET_SIZE=512
    -D MY_NODE_ID=0
    -D MY_TRANSPORT_WAIT_READY_MS=1
    -D MY_GATEWAY_FEATURE
    ; CE do nRF24 legado no J4 = D1/GPIO5 (o protótipo usa 2, que aqui é o gate do LED verde)
    -D MY_RF24_CE_PIN=5
    -D MY_RF24_CSN_PIN=15
    -D MY_TRANSPORT_DISCOVERY_TIMEOUT=60000
    -D MY_TRANSPORT_SANITY_CHECK_INTERVAL_MS=30000
    -D MY_OTA_LOG_SENDER_FEATURE
    -D M360_NATIVE_MQTT=1
    -D M360_BOARD_GW

; =======================================================
; ENV: NÓ CENTRAL DE ATUAÇÃO ESTUFA (Arduino Nano ATmega328)
; Nó 99 — nodeReles
; Hardware: Arduino Nano + MUX CD74HC4067 + 9 relés (7 MUX + 2 nativos)
; Pinagem (fonte: sensorDrivers.h):
;   MUX      D8=SIG, D4-D7=S0-S3  -> Sol.A/B/C, Perist.SuplA/B, pH+/pH-
;   Nativos  A0=BombaNFT, A1=BombaOxi
;   DHT11    D2
;   Vazão    D3 (INT1, YF-S201)
; Child IDs (contrato com o Node-RED): 11/12 clima, 21 vazão, 31-39 atuadores
; =======================================================
[env:nano_99reles]
extends = common
platform = atmelavr
board = nanoatmega328
framework = arduino
lib_deps =
	mysensors/MySensors@^2.3.2
	adafruit/DHT sensor library@^1.4.6
	adafruit/Adafruit Unified Sensor@^1.1.14
build_flags =
	${proto_rf24.flags}
	-D MY_NODE_ID=99
	-D MY_DEBUG
build_src_filter = +<src/DRY/horta/nos/99nodeReles/>

; === Nó 99 como Repeater ===
; Mesmo hardware que nano_99reles. MY_REPEATER_FEATURE ativa o encaminhamento de
; mensagens de nós fora do alcance direto do gateway (tabela de roteamento 256B em EEPROM).
; Manter FORA de default_envs — flash manual: pio run -e nano_99reles_rep -t upload
[env:nano_99reles_rep]
extends = env:nano_99reles
build_flags =
	${env:nano_99reles.build_flags}
	-D MY_REPEATER_FEATURE

; === No 99 instrumentado para diagnostico ===
; Igual a nano_99reles, mais um batimento serial de 5 s com uptime e RAM livre.
; Serve para separar travamento do loop() de exaustao de RAM.
; Manter FORA de default_envs — flash manual:
;   pio run -e nano_99reles_diag -t upload
[env:nano_99reles_diag]
extends = env:nano_99reles
upload_port = COM10
monitor_port = COM10
build_flags =
	${env:nano_99reles.build_flags}
	-D NODE99_HEALTH_LOG

; =======================================================
; PLACA M360-ACT (Pro Mini 3,3 V / 8 MHz) — Nó 99 na placa nova
; Mesmo fonte de nano_99reles; as diferenças de placa ficam atrás de
; -D NODE99_BOARD_ACT (decisão 8 do ARQUITETURA_FAMILIA.md: um env por placa,
; e o env nano_99reles segue servindo o Nano atual).
; Pinagem (netlist de 2026-10-14, ARQUITETURA_FAMILIA.md §5.4):
;   MUX      D8=SIG, D4-D7=S0-S3 e A0/A1 bombas, todos via 74HCT244
;   /OE      A5 (74HCT244) — liberado por último em initSensors()
;   Vazão    D3 (INT1), INPUT puro (R3/R4/BAT54WS na placa)
;   Rádio    D2=DIO0, A2=DIO1, A3=RESET, D10-D13 SPI; nRF24 legado no J6 (CE=D2)
;   Sem DHT: children 11/12 não existem nesta placa (21 e 31-39 inalterados)
; =======================================================
[env:act_99]
extends = common
platform = atmelavr
board = pro8MHzatmega328
framework = arduino
upload_speed = 57600
; chain+ avalia o #ifndef NODE99_BOARD_ACT em volta do <DHT.h>: sem isso o LDF
; procuraria a lib DHT, que este env não declara de propósito.
lib_ldf_mode = chain+
lib_deps =
	mysensors/MySensors@^2.3.2
build_src_filter = +<src/DRY/horta/nos/99nodeReles/>
build_flags =
	${common.flags}
	-D MY_NODE_ID=99
	-D MY_DEBUG
	-D NODE99_BOARD_ACT
	; Mezanino RFM95W (J2): DIO0=D2 e NSS=D10 são os padrões da lib no AVR; o RESET está no A3.
	-D MY_RFM95_RST_PIN=17
	; nRF24 legado no header J6 (exclusivo com o mezanino): CE=D2 (padrão da lib é D9); CSN no padrão D10.
	-D MY_RF24_CE_PIN=2

; === Nó 99 na M360-ACT como Repeater === (espelha nano_99reles_rep)
; Manter FORA de default_envs — flash manual: pio run -e act_99_rep -t upload
[env:act_99_rep]
extends = env:act_99
build_flags =
	${env:act_99.build_flags}
	-D MY_REPEATER_FEATURE

[env:ProMini_01nodeSolo3d]
extends = common
platform = atmelavr
board = pro16MHzatmega328
framework = arduino
upload_speed = 57600
lib_deps =
	mysensors/MySensors@^2.3.2
build_flags =
	${proto_rf24.flags}
	-D MY_NODE_ID=1
	-D MY_DEBUG
	-D MY_TRANSPORT_SANITY_CHECK_INTERVAL_MS=15000
build_src_filter = +<src/DRY/horta/nos/01nodeSolo3dNano/01nodeSolo3dNano.cpp>



[env:nano_01nodeSolo3d]
extends = common
platform = atmelavr
board = nanoatmega328
framework = arduino
lib_deps =
	mysensors/MySensors@^2.3.2
build_flags =
	${proto_rf24.flags}
	-D MY_NODE_ID=1
	-D MY_DEBUG
	-D MY_TRANSPORT_SANITY_CHECK_INTERVAL_MS=15000
build_src_filter = +<src/DRY/horta/nos/01nodeSolo3dNano/01nodeSolo3dNano.cpp>




[env:nano_02nodeSolo3d]
extends = common
platform = atmelavr
board = nanoatmega328
framework = arduino
lib_deps =
	mysensors/MySensors@^2.3.2
build_flags =
	${proto_rf24.flags}
	-D MY_NODE_ID=2
	-D MY_DEBUG
	-D MY_TRANSPORT_SANITY_CHECK_INTERVAL_MS=15000
build_src_filter = +<src/DRY/horta/nos/02nodeSolo3dNano/02nodeSolo3dNano.cpp>





; =======================================================
; PLACA M360-LP (Pro Mini 3,3 V / 8 MHz) — firmware comum, config por nó
; Fonte: src/DRY/horta/nos/lp/ (ver README.md). Cada env só muda MY_NODE_ID e o
; -I que aponta para config/<nó>/nodeConfig.h. Decisão 8 do ARQUITETURA_FAMILIA.md:
; os envs antigos (nano_*, ProMini_*) seguem servindo o hardware Nano atual.
; =======================================================
[lp_base]
extends = common
platform = atmelavr
board = pro8MHzatmega328
framework = arduino
upload_speed = 57600
; chain+ avalia os #if LP_HAS_* ao resolver dependências. As libs de sensor são
; compiladas, mas um driver desligado no nodeConfig.h não as referencia e o
; linker as descarta: lp_01 (só solo) mede o mesmo que o nó no Nano.
lib_ldf_mode = chain+
lib_deps =
	mysensors/MySensors@^2.3.2
	adafruit/DHT sensor library@^1.4.6
	adafruit/Adafruit Unified Sensor@^1.1.14
	milesburton/DallasTemperature@^3.9.1
	paulstoffregen/OneWire@^2.3.7
build_src_filter = +<src/DRY/horta/nos/lp/>
; Pinos dos dois rádios: só o do rádio compilado tem efeito.
board_flags =
	-Isrc/DRY/horta/nos/lp
	; Mezanino RFM95W (J4): DIO0=D2 e NSS=D10 são os padrões da lib no AVR; o RESET não.
	-D MY_RFM95_RST_PIN=8
	; nRF24 legado no header J5 (exclusivo com o mezanino): CE=D2 (padrão da lib é D9=DIO1).
	-D MY_RF24_CE_PIN=2
; Rede da estufa (nRF24). Nó LP de uma rede LoRa: build_flags = ${lora_net.flags} ${lp_base.board_flags} ...
build_flags =
	${common.flags}
	${lp_base.board_flags}

[env:lp_01]
extends = lp_base
build_flags =
	${lp_base.build_flags}
	-D MY_NODE_ID=1
	-D MY_DEBUG
	-Isrc/DRY/horta/nos/lp/config/node01

[env:lp_02]
extends = lp_base
build_flags =
	${lp_base.build_flags}
	-D MY_NODE_ID=2
	-D MY_DEBUG
	-Isrc/DRY/horta/nos/lp/config/node02

[env:ProMini_04noodeSolarMini]
extends = common
platform = atmelavr
board = pro16MHzatmega328
framework = arduino
upload_speed = 57600
lib_deps =
	mysensors/MySensors@^2.3.2
	adafruit/DHT sensor library@^1.4.6
	adafruit/Adafruit Unified Sensor@^1.1.14
	milesburton/DallasTemperature@^3.9.1
	paulstoffregen/OneWire@^2.3.7
build_flags = 
	${proto_rf24.flags}
	-D MY_NODE_ID=4
    -D MY_DEBUG
	; Intervalo nominal de fábrica (min). Só vale com EEPROM virgem/inválida:
	; um nó já gravado mantém o valor da EEPROM (child 254) até receber C_SET V_VAR1.
	; Nunca como constante no .cpp — o warm-up (R13) volta ao valor da EEPROM.
	-D M360_DEFAULT_INTERVAL=30
	-Isrc/DRY/horta/nos/04noodeSolarMini
build_src_filter =
	+<src/DRY/horta/nos/04noodeSolarMini/04noodeSolarMini.cpp>
	+<src/DRY/horta/nos/04noodeSolarMini/sensorDrivers.cpp>


; =======================================================
; NÓS REMOVIDOS — 5 (Solo MUX), 13 (ZTS Umidade/Hall) e 80 (Aqua)
; =======================================================
; Nó 5 (05nodeSolo3dNanoMux): removido do projeto a pedido. Duplicava
; funcionalmente os nós 1 e 2 (mesmos canteiros, mesmos rótulos A_*/B_*) e não
; tinha consumidor no Node-RED. Fontes recuperáveis no histórico do git.
; Os fontes destes nós viviam em src/DRY/nos/ (layout pré-monorepo) e foram
; apagados no commit d169901 sem migração para src/DRY/horta/nos/. Os envs
; correspondentes ficaram apontando para diretórios inexistentes e falhavam
; com "Nothing to build", então foram removidos.
;
; Para retomar o 13 ou o 80, recuperar os fontes do commit 0ccf66a (o Nó 5 viveu
; em src/DRY/horta/nos/05nodeSolo3dNanoMux; ver commits 5b8c94e e d169901):
;   git checkout 0ccf66a -- src/DRY/nos/80nodeAqua
;   git checkout 0ccf66a -- src/DRY/nos/13nodeZTS_UmidadeHall
; mover para src/DRY/horta/nos/ e recriar o env (ver histórico deste arquivo).

[env:lp_lora_teste]
extends = lp_base
build_flags =
	${lora_net.flags}
	${lp_base.board_flags}
	-D MY_NODE_ID=1
	-Isrc/DRY/horta/nos/lp/config/node01
