<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <style>
    .title { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #1a237e; }
    .subtitle { font-family: sans-serif; font-size: 11px; fill: #5c6bc0; }
    .box-mcu { fill: #e3f0ff; stroke: #0055aa; stroke-width: 2; }
    .box-radio { fill: #e8f5e9; stroke: #1a7a3a; stroke-width: 2; }
    .box-power { fill: #fff8e1; stroke: #f9a825; stroke-width: 2; }
    .box-sensors { fill: #e0f2f1; stroke: #00796b; stroke-width: 2; }
    .text-bold { font-family: sans-serif; font-size: 12px; font-weight: bold; fill: #333; }
    .text-normal { font-family: sans-serif; font-size: 10px; fill: #444; }
    .text-pin { font-family: sans-serif; font-size: 11px; font-weight: bold; fill: #b71c1c; }
  </style>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#333" />
    </marker>
  </defs>

  <!-- Cabeçalho -->
  <text x="20" y="30" class="title">Nó 11 (miniDHT) — Kit Hélio</text>
  <text x="20" y="48" class="subtitle">Diagrama de Blocos de Hardware (Arduino Pro Mini + DHT11 + nRF24L01+)</text>

  <!-- FONTE DE ALIMENTAÇÃO -->
  <rect x="20" y="80" width="160" height="70" rx="6" class="box-power"/>
  <text x="100" y="105" class="text-bold" text-anchor="middle">⚡ FONTE 5V DC</text>
  <text x="100" y="125" class="text-normal" text-anchor="middle">Alimentação Contínua</text>

  <!-- REGULADOR 3.3V PARA RADIO -->
  <rect x="20" y="180" width="160" height="50" rx="6" class="box-power"/>
  <text x="100" y="202" class="text-bold" text-anchor="middle">⚡ REGULADOR 3.3V</text>
  <text x="100" y="218" class="text-normal" text-anchor="middle">Alimentação nRF24L01+</text>

  <!-- ARDUINO PRO MINI (5V/16MHz) -->
  <rect x="240" y="80" width="160" height="220" rx="6" class="box-mcu"/>
  <text x="320" y="110" class="text-bold" text-anchor="middle">🧠 ARDUINO PRO MINI</text>
  <text x="320" y="130" class="text-normal" text-anchor="middle">ATmega328P (5V / 16MHz)</text>
  <text x="320" y="150" class="text-normal" text-anchor="middle">Perfil: M360_ALWAYS_ON</text>

  <!-- SENSOR DHT11 -->
  <rect x="20" y="270" width="160" height="70" rx="6" class="box-sensors"/>
  <text x="100" y="295" class="text-bold" text-anchor="middle">🌡️ SENSOR DHT11</text>
  <text x="100" y="315" class="text-normal" text-anchor="middle">Temp (Ch 11) / Umid (Ch 12)</text>

  <!-- RÁDIO nRF24L01+ -->
  <rect x="440" y="80" width="140" height="150" rx="6" class="box-radio"/>
  <text x="510" y="110" class="text-bold" text-anchor="middle">📻 nRF24L01+</text>
  <text x="510" y="130" class="text-normal" text-anchor="middle">Transceptor 2.4GHz</text>
  <text x="510" y="150" class="text-normal" text-anchor="middle">CE: D9 / CSN: D10</text>
  <text x="510" y="170" class="text-normal" text-anchor="middle">Potência: LOW</text>

  <!-- CONEXÕES -->
  <line x1="180" y1="115" x2="240" y2="115" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="100" y1="150" x2="100" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="180" y1="205" x2="440" y2="205" stroke="#e65100" stroke-width="1.5" stroke-dasharray="4,4"/>

  <line x1="180" y1="305" x2="240" y2="250" stroke="#00796b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="200" y="265" class="text-pin">D4 Data</text>

  <line x1="400" y1="150" x2="440" y2="150" stroke="#1a7a3a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="415" y="142" class="text-pin">SPI</text>
</svg>
