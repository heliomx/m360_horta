; PlatformIO Project Configuration File - Root (Monorepo M360)
; ==========================================================
; Configuração raiz agregadora que inclui os sub-projetos:
; - Horta (src/DRY/horta/platformio.ini)
; - Kit Hélio (src/DRY/kit-helio/platformio.ini)
;
; Docs: https://docs.platformio.org/page/projectconf/section_platformio_extra_configs.html

[platformio]
workspace_dir = ${sysenv.TEMP}/pio_builds/${sysenv.USERNAME}/${project.name}
lib_dir = lib
include_dir = include

default_envs = d1_mini_gateway, ProMini_01nodeSolo3d, nano_01nodeSolo3d, nano_02nodeSolo3d, nano_99reles, nano_13nodeZTS_UmidadeHall, nano_80nodeAqua, nano_05nodeSolo3dNanoMux, d1_mini_kit_helio_gateway

extra_configs =
    src/DRY/horta/platformio.ini
    src/DRY/kit-helio/platformio.ini
