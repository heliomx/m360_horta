; PlatformIO Project Configuration File - Root (Monorepo M360)
; ==========================================================
; Configuração raiz agregadora que inclui os sub-projetos:
; - Horta (src/DRY/horta/platformio.ini)
; - Kit Hélio (src/DRY/kit-helio/platformio.ini)
;
; Docs: https://docs.platformio.org/page/projectconf/section_platformio_extra_configs.html

[platformio]
workspace_dir = ${sysenv.TEMP}/pio_builds/${sysenv.USERNAME}/m360_horta
src_dir = .
lib_dir = lib
include_dir = include

; Protótipos em campo + placas da família M360 (lp_*, act_99, d1_mini_gw).
default_envs = d1_mini_gateway, d1_mini_gw, ProMini_01nodeSolo3d, nano_01nodeSolo3d, nano_02nodeSolo3d, lp_01, lp_02, ProMini_04noodeSolarMini, nano_99reles, act_99, d1_mini_kit_helio_gateway

extra_configs =
    src/DRY/horta/platformio.ini
    src/DRY/kit-helio/platformio.ini
