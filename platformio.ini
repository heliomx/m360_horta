; PlatformIO Project Configuration File - Root (Monorepo M360)
; ==========================================================
; Configuração raiz agregadora que inclui os sub-projetos:
; - Horta (src/DRY/horta/platformio.ini)
; - Kit Hélio (src/DRY/kit-helio/platformio.ini)
;
; Docs: https://docs.platformio.org/page/projectconf/section_platformio_extra_configs.html

[platformio]
extra_configs =
    src/DRY/horta/platformio.ini
    src/DRY/kit-helio/platformio.ini

; build_dir e default_envs vivem AQUI, nunca nos sub-configs.
; Valores de extra_configs sobrescrevem os do arquivo raiz, e o último
; extra_config vence: quando cada sub-config declarava seu próprio default_envs,
; o do kit-helio anulava toda a lista do horta e `pio run` compilava um único env.

; Redireciona a compilação pesada para a pasta Temp local de cada PC.
; O PlatformIO só interpola platformio.*, sysenv.*, this.* e env:* — não há
; token para o nome do projeto; usar literal.
build_dir = ${sysenv.TEMP}/pio_builds/${sysenv.USERNAME}/m360_horta

default_envs =
    d1_mini_gateway
    ProMini_01nodeSolo3d
    nano_01nodeSolo3d
    nano_02nodeSolo3d
    nano_99reles
    nano_13nodeZTS_UmidadeHall
    nano_05nodeSolo3dNanoMux
    check_node_template
    d1_mini_kit_helio_gateway
; nano_80nodeAqua FORA da lista: o env aponta para src/DRY/horta/nos/80nodeAqua/,
; diretório que não existe no repositório ("Nothing to build"). Reinserir aqui
; quando as fontes do nó 80 voltarem.
