sentence=Sensores de solo e lisimetro ceramico da familia SU-xxT (Manejo360).
paragraph=Umidade de solo em duas profundidades, temperatura da rizosfera, e pH, condutividade e nivel da solucao extraida por um lisimetro ceramico. Orquestra o ADC I2C ADS1115, o multiplexador analogico 74HC4051, o barramento 1-Wire do DS18B20 e a excitacao AC das celulas de EC e nivel, aplicando compensacao termica de EC (EC25) e de pH (Nernst com calibracao de tres pontos). API no padrao DallasTemperature/OneWire: disparo global de conversao, acesso por indice e constantes de erro.
