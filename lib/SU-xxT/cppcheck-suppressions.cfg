<?xml version="1.0"?>
<!--
  cppcheck-suppressions.cfg — Supressões para a biblioteca SU-xxT
  Uso: pio check -e check_su_xxt

  Regra: suprimir SOMENTE falsos positivos documentados.
  Não suprimir erros reais — a build deve falhar nesse caso.

  Nota: as supressões PONTUAIS desta lib são inline no código
  (// cppcheck-suppress <id>), junto da justificativa. Este arquivo cobre
  apenas o que é global ao ambiente de análise.
-->
<suppressions>

  <!--
    missingInclude: Arduino.h, Wire.h, EEPROM.h e os headers da Adafruit /
    OneWire / DallasTemperature são resolvidos pelo ambiente PlatformIO e não
    estão no include path do cppcheck standalone.
  -->
  <suppress>
    <id>missingInclude</id>
  </suppress>

  <!--
    missingIncludeSystem: mesmo motivo, para headers de sistema AVR
    (<avr/io.h>, <avr/pgmspace.h>, etc.)
  -->
  <suppress>
    <id>missingIncludeSystem</id>
  </suppress>

  <!--
    unusedFunction: a lib é uma API pública. Métodos como getECRaw(),
    resetCalibration() e resetRechargeState() são chamados pelo NÓ, que não
    faz parte deste escopo de análise — cppcheck os vê como órfãos.
  -->
  <suppress>
    <id>unusedFunction</id>
  </suppress>

</suppressions>
